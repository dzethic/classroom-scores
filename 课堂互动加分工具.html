<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="课堂加分">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%231a73e8'/><text x='90' y='120' text-anchor='middle' font-size='100' fill='white'>📋</text></svg>">
<title>课堂互动加分系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1a73e8;--primary-light:#e8f0fe;--primary-dark:#1557b0;--success:#34a853;--danger:#ea4335;--warning:#fbbc04;--bg:#f5f7fa;--card:#fff;--text:#202124;--text-secondary:#5f6368;--border:#dadce0;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(26,115,232,.3)}
.header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.header .info{font-size:13px;opacity:.85}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:99}
.tab{flex:1;padding:14px;text-align:center;font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--primary-light)}
.container{max-width:600px;margin:0 auto;padding:16px}
.search-box{position:relative;margin-bottom:16px}
.search-box input{width:100%;padding:16px 20px;font-size:20px;border:2px solid var(--border);border-radius:var(--radius);outline:none;transition:border-color .2s;background:var(--card)}
.search-box input:focus{border-color:var(--primary)}
.search-box input::placeholder{color:#aaa}
.search-result{margin-top:12px}
.student-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:2px solid transparent;transition:all .2s}
.student-card.selected{border-color:var(--primary);background:var(--primary-light)}
.student-card .name{font-size:24px;font-weight:700;color:var(--text)}
.student-card .meta{font-size:14px;color:var(--text-secondary);margin-top:4px}
.student-card .score-display{margin-top:10px;font-size:18px;font-weight:600;color:var(--primary)}
.score-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.score-btn{padding:16px 8px;font-size:20px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;transition:all .15s;touch-action:manipulation}
.score-btn:active{transform:scale(.95)}
.score-btn.plus{background:#e6f4ea;color:var(--success)}
.score-btn.plus:active{background:#ceead6}
.score-btn.minus{background:#fce8e6;color:var(--danger)}
.score-btn.minus:active{background:#f8d7da}
.score-btn.reset{background:#fef7e0;color:#e37400;font-size:14px}
.score-btn.reset:active{background:#fdefc3}
.hint-text{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:16px}
.no-match{color:var(--danger);text-align:center;padding:20px;font-size:16px}
.records-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.records-header h2{font-size:18px;color:var(--text)}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:8px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);font-size:13px;cursor:pointer;transition:all .2s}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.record-item{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.record-item .top{display:flex;justify-content:space-between;align-items:center}
.record-item .student-info .rname{font-size:17px;font-weight:600}
.record-item .student-info .rmeta{font-size:13px;color:var(--text-secondary);margin-top:2px}
.record-item .total-score{font-size:24px;font-weight:700;color:var(--primary)}
.record-item .details{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.record-item .detail-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);padding:3px 0}
.record-item .detail-row .delta.positive{color:var(--success);font-weight:600}
.record-item .detail-row .delta.negative{color:var(--danger);font-weight:600}
.toggle-details{font-size:13px;color:var(--primary);cursor:pointer;margin-top:8px;display:inline-block}
.action-bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.action-btn{flex:1;min-width:120px;padding:12px 16px;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.action-btn.export{background:var(--primary);color:#fff}
.action-btn.export:active{background:var(--primary-dark)}
.action-btn.clear{background:#fce8e6;color:var(--danger)}
.action-btn.clear:active{background:#f8d7da}
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.confirm-box{background:var(--card);border-radius:var(--radius);padding:24px;max-width:360px;width:100%;text-align:center}
.confirm-box p{font-size:16px;margin-bottom:20px;line-height:1.5}
.confirm-box .btns{display:flex;gap:10px}
.confirm-box .btns button{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.confirm-box .btns .cancel{background:var(--border);color:var(--text)}
.confirm-box .btns .confirm{background:var(--danger);color:#fff}
.empty-records{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.empty-records .icon{font-size:48px;margin-bottom:12px}
.badge{display:inline-block;background:var(--primary);color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600;margin-left:6px}
.import-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.import-box{background:var(--card);border-radius:var(--radius);padding:24px;max-width:480px;width:100%}
.import-box h3{font-size:18px;margin-bottom:8px}
.import-box .desc{font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.5}
.import-box textarea{width:100%;height:140px;border:2px solid var(--border);border-radius:8px;padding:12px;font-size:15px;font-family:monospace;resize:vertical;outline:none;transition:border-color .2s}
.import-box textarea:focus{border-color:var(--primary)}
.import-box .preview{margin-top:12px;font-size:13px;color:var(--text-secondary);line-height:1.6}
.import-box .preview .matched{color:var(--success);font-weight:600}
.import-box .preview .unmatched{color:var(--danger);font-weight:600}
.import-box .btns{display:flex;gap:10px;margin-top:16px}
.import-box .btns button{flex:1;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.import-box .btns .cancel{background:var(--border);color:var(--text)}
.import-box .btns .do-import{background:var(--primary);color:#fff}
.import-box .btns .do-import:active{background:var(--primary-dark)}
.action-btn.import{background:#e8f5e9;color:#2e7d32}
.action-btn.import:active{background:#c8e6c9}
@media(max-width:400px){
.score-buttons{grid-template-columns:repeat(2,1fr)}
.header h1{font-size:19px}
.search-box input{font-size:18px;padding:14px 16px}
}
</style>
</head>
<body>
<div class="header">
<h1>📋 课堂互动加分系统</h1>
<div class="info">马克思主义基本原理 · 负责人：朱墨青</div>
</div>
<div class="tabs">
<div class="tab active" onclick="showTab('scoring')">加分操作</div>
<div class="tab" onclick="showTab('records')">记录查看<span class="badge" id="recordBadge" style="display:none">0</span></div>
</div>
<div class="container">
<div id="scoringPanel">
<div class="search-box">
<input type="text" id="searchInput" placeholder="输入学号后四位（如3101）" inputmode="numeric" maxlength="10" autocomplete="off" oninput="handleSearch()">
</div>
<div id="searchResult" class="search-result">
<div class="hint-text">请输入学号后四位快速定位学生</div>
</div>
<div id="scoreAction" style="display:none">
<div class="score-buttons">
<button class="score-btn plus" onclick="addScore(1)">+1</button>
<button class="score-btn plus" onclick="addScore(2)">+2</button>
<button class="score-btn plus" onclick="addScore(3)">+3</button>
<button class="score-btn minus" onclick="addScore(-1)">-1</button>
</div>
<div style="margin-top:10px">
<button class="score-btn reset" style="width:100%" onclick="resetStudent()">清零该学生分数</button>
</div>
</div>
</div>
<div id="recordsPanel" style="display:none">
<div class="records-header">
<h2>加分记录</h2>
</div>
<div class="filter-bar" id="filterBar"></div>
<div id="recordsList"></div>
<div class="action-bar">
<button class="action-btn export" onclick="exportSummary()">导出汇总CSV</button>
<button class="action-btn export" onclick="exportDetail()">导出明细CSV</button>
<button class="action-btn import" onclick="showImportDialog()">📥 导入历史数据</button>
<button class="action-btn clear" onclick="clearAll()">清空所有记录</button>
</div>
</div>
</div>
<div id="importOverlay" class="import-overlay" style="display:none">
<div class="import-box">
<h3>📥 导入历史加分数据</h3>
<div class="desc">将学号后四位粘贴到下方，支持空格、换行、逗号分隔。<br>每个号码将自动匹配学生并 +1 分。</div>
<textarea id="importTextarea" placeholder="例如：3446 3446 3413 3340 3431 3440..." oninput="previewImport()"></textarea>
<div class="preview" id="importPreview"></div>
<div class="btns">
<button class="cancel" onclick="hideImportDialog()">取消</button>
<button class="do-import" id="doImportBtn" onclick="doImport()" disabled>确认导入</button>
</div>
</div>
</div>
<div id="confirmOverlay" class="confirm-overlay" style="display:none">
<div class="confirm-box">
<p id="confirmText">确定要清空所有记录吗？此操作不可恢复。</p>
<div class="btns">
<button class="cancel" onclick="hideConfirm()">取消</button>
<button class="confirm" id="confirmBtn" onclick="">确定</button>
</div>
</div>
</div>

const CLASS_NAMES={"31":"财管专升本B261231","32":"会计专升本B261232","33":"会计专升本B261233","34":"会计专升本B261234","35":"审计专升本B261235","36":"审计专升本B261236"};
const STORAGE_KEY="classroom_scores_v1";
let currentStudent=null;
let currentFilter="all";

function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch(e){return{}}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}

function handleSearch(){
const input=document.getElementById("searchInput").value.trim();
const result=document.getElementById("searchResult");
const action=document.getElementById("scoreAction");
if(!input){result.innerHTML='<div class="hint-text">请输入学号后四位快速定位学生</div>';action.style.display="none";currentStudent=null;return}
const matches=STUDENTS.filter(s=>s.s.startsWith(input)||s.id.endsWith(input));
if(matches.length===0){result.innerHTML='<div class="no-match">未找到该学生</div>';action.style.display="none";currentStudent=null;return}
if(matches.length===1){selectStudent(matches[0]);return}
let html='';
matches.forEach(s=>{
const data=loadData();const key=s.id;
const total=(data[key]||[]).reduce((a,b)=>a+b.d,0);
html+='<div class="student-card" onclick="selectStudent(STUDENTS.find(x=>x.id===\''+s.id+'\'))" style="margin-bottom:10px;cursor:pointer">';
html+='<div class="name">'+s.n+'</div>';
html+='<div class="meta">'+s.id+' · '+s.c+'</div>';
if(total>0)html+='<div class="score-display">当前积分：'+total+'</div>';
html+='</div>';});
result.innerHTML=html;action.style.display="none";currentStudent=null}

function selectStudent(s){
currentStudent=s;
const data=loadData();const records=data[s.id]||[];
const total=records.reduce((a,b)=>a+b.d,0);
const result=document.getElementById("searchResult");
result.innerHTML='<div class="student-card selected">'
+'<div class="name">'+s.n+'</div>'
+'<div class="meta">'+s.id+' · '+s.c+'</div>'
+'<div class="score-display">当前积分：'+total+'</div>'
+(records.length?'<div class="meta" style="margin-top:6px">共'+records.length+'次操作</div>':'')
+'</div>';
document.getElementById("scoreAction").style.display="block";
document.getElementById("searchInput").value=s.s}

function addScore(delta){
if(!currentStudent)return;
const data=loadData();
if(!data[currentStudent.id])data[currentStudent.id]=[];
data[currentStudent.id].push({d:delta,t:Date.now()});
saveData(data);
selectStudent(currentStudent);
updateBadge()}

function resetStudent(){
if(!currentStudent)return;
if(!confirm("确定清零 "+currentStudent.n+" 的分数吗？"))return;
const data=loadData();delete data[currentStudent.id];saveData(data);
selectStudent(currentStudent);updateBadge()}

function showTab(tab){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.querySelectorAll(".tab")[tab==="scoring"?0:1].classList.add("active");
document.getElementById("scoringPanel").style.display=tab==="scoring"?"block":"none";
document.getElementById("recordsPanel").style.display=tab==="records"?"block":"none";
if(tab==="records")showRecords()}

function showRecords(){
const data=loadData();
const filterBar=document.getElementById("filterBar");
let fhtml='<div class="filter-btn'+(currentFilter==="all"?" active":"")+'" onclick="setFilter(\'all\')">全部</div>';
Object.keys(CLASS_NAMES).forEach(cn=>{
fhtml+='<div class="filter-btn'+(currentFilter===cn?" active":"")+'" onclick="setFilter(\''+cn+'\')">'+CLASS_NAMES[cn].replace(/B2612\d+/,'')+'</div>';});
filterBar.innerHTML=fhtml;
const list=document.getElementById("recordsList");
let items=[];
Object.keys(data).forEach(sid=>{
const records=data[sid];if(!records||!records.length)return;
const student=STUDENTS.find(s=>s.id===sid);if(!student)return;
if(currentFilter!=="all"&&student.cn!==currentFilter)return;
const total=records.reduce((a,b)=>a+b.d,0);
items.push({student,total,records})});
items.sort((a,b)=>b.total-a.total);
if(!items.length){list.innerHTML='<div class="empty-records"><div class="icon">📝</div><div>暂无加分记录</div></div>';return}
let html='';
items.forEach((item,idx)=>{
const s=item.student;
html+='<div class="record-item"><div class="top"><div class="student-info">'
+'<div class="rname">'+s.n+'</div>'
+'<div class="rmeta">'+s.s+' · '+s.c+'</div></div>'
+'<div class="total-score">'+item.total+'</div></div>'
+'<div class="toggle-details" onclick="toggleDetail('+idx+')">展开详情 ('+item.records.length+'次)</div>'
+'<div class="details" id="detail_'+idx+'" style="display:none">';
item.records.slice().reverse().forEach(r=>{
const dt=new Date(r.t);const ts=dt.getMonth()+1+'/'+dt.getDate()+' '+dt.getHours()+':'+String(dt.getMinutes()).padStart(2,'0');
const cls=r.d>0?'positive':'negative';
html+='<div class="detail-row"><span>'+ts+'</span><span class="delta '+cls+'">'+(r.d>0?'+':'')+r.d+'</span></div>';});
html+='</div></div>';});
list.innerHTML=html}

function toggleDetail(idx){
const el=document.getElementById("detail_"+idx);
el.style.display=el.style.display==="none"?"block":"none"}

function setFilter(f){currentFilter=f;showRecords()}

function exportSummary(){
const data=loadData();
let csv='\uFEFF学号,姓名,班级,总分,加分次数\n';
let count=0;
STUDENTS.forEach(s=>{
const records=data[s.id];
if(!records||!records.length)return;
const total=records.reduce((a,b)=>a+b.d,0);
csv+=s.id+','+s.n+','+s.c+','+total+','+records.length+'\n';count++});
if(!count){alert("暂无记录可导出");return}
downloadCSV(csv,'课堂互动加分汇总.csv')}

function exportDetail(){
const data=loadData();
let csv='\uFEFF学号,姓名,班级,时间,变动分数\n';
let count=0;
STUDENTS.forEach(s=>{
const records=data[s.id];if(!records)return;
records.forEach(r=>{
const dt=new Date(r.t);
const ts=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')+':'+String(dt.getSeconds()).padStart(2,'0');
csv+=s.id+','+s.n+','+s.c+','+ts+','+(r.d>0?'+':'')+r.d+'\n';count++})});
if(!count){alert("暂无记录可导出");return}
downloadCSV(csv,'课堂互动加分明细.csv')}

function downloadCSV(content,filename){
const blob=new Blob([content],{type:'text/csv;charset=utf-8'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=filename;
document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url)}

function clearAll(){
document.getElementById("confirmText").textContent="确定要清空所有加分记录吗？此操作不可恢复！";
document.getElementById("confirmBtn").onclick=function(){
localStorage.removeItem(STORAGE_KEY);hideConfirm();
document.getElementById("searchResult").innerHTML='<div class="hint-text">请输入学号后四位快速定位学生</div>';
document.getElementById("scoreAction").style.display="none";currentStudent=null;
if(document.getElementById("recordsPanel").style.display!=="none")showRecords();
updateBadge()};
document.getElementById("confirmOverlay").style.display="flex"}

function hideConfirm(){document.getElementById("confirmOverlay").style.display="none"}

function updateBadge(){
const data=loadData();
const count=Object.keys(data).filter(k=>data[k]&&data[k].length>0).length;
const badge=document.getElementById("recordBadge");
if(count>0){badge.style.display="inline-block";badge.textContent=count}
else{badge.style.display="none"}}

document.addEventListener("DOMContentLoaded",function(){updateBadge()});

function showImportDialog(){
document.getElementById("importOverlay").style.display="flex";
document.getElementById("importTextarea").value="";
document.getElementById("importPreview").innerHTML="";
document.getElementById("doImportBtn").disabled=true;
setTimeout(()=>document.getElementById("importTextarea").focus(),100)}

function hideImportDialog(){document.getElementById("importOverlay").style.display="none"}

function parseImportNumbers(text){
const tokens=text.split(/[\s,，;；\n\r\t]+/).filter(t=>t.length>0);
const result=[];
tokens.forEach(t=>{const m=t.match(/\d{4}$/);if(m)result.push(m[0])});
return result}

function previewImport(){
const text=document.getElementById("importTextarea").value;
const numbers=parseImportNumbers(text);
const preview=document.getElementById("importPreview");
if(numbers.length===0){preview.innerHTML="";document.getElementById("doImportBtn").disabled=true;return}
const matched=[];const unmatched=[];
const nameMap={};
numbers.forEach(num=>{
const student=STUDENTS.find(s=>s.s===num);
if(student){matched.push({num,name:student.n,cls:student.c});if(!nameMap[num])nameMap[num]={name:student.n,count:0};nameMap[num].count++}
else{if(!unmatched.includes(num))unmatched.push(num)}});
let html='<div>共解析 <b>'+numbers.length+'</b> 个号码</div>';
if(matched.length>0){
html+='<div class="matched">✓ 匹配成功 '+matched.length+' 个（'+Object.keys(nameMap).length+' 人）</div>';
html+='<div style="margin-top:6px;font-size:12px">';
Object.keys(nameMap).sort().forEach(num=>{html+='<span style="margin-right:10px">'+nameMap[num].name+'('+num+') ×'+nameMap[num].count+'</span>'});
html+='</div>'}
if(unmatched.length>0){html+='<div class="unmatched">✗ 未匹配 '+unmatched.length+' 个：'+unmatched.join(', ')+'</div>'}
preview.innerHTML=html;
document.getElementById("doImportBtn").disabled=matched.length===0}

function doImport(){
const text=document.getElementById("importTextarea").value;
const numbers=parseImportNumbers(text);
const data=loadData();
let importCount=0;
const now=Date.now();
numbers.forEach((num,idx)=>{
const student=STUDENTS.find(s=>s.s===num);
if(student){
if(!data[student.id])data[student.id]=[];
data[student.id].push({d:1,t:now+idx});
importCount++}});
saveData(data);
hideImportDialog();
alert('导入完成！共导入 '+importCount+' 条加分记录。');
updateBadge();
if(document.getElementById("recordsPanel").style.display!=="none")showRecords()}
</script>
